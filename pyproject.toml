[project]
name = "command-center"
version = "0.1.0"
description = "Panel do zarządzania zasobami, procesami, kontenerami i usługami lokalnymi"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nicegui>=2.20",
    "psutil>=6.0",
    "nvidia-ml-py>=12.560",
    "docker>=7.1",
    "pyyaml>=6.0",
]

[project.scripts]
command-center = "command_center.app:main"
cctl = "command_center.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["command_center"]
